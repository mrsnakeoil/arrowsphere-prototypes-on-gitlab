name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks secret scan
        # Attempts a commit-range scan first (fast, only scans new commits).
        # Falls back to a full-repo scan if the range is invalid — this happens
        # on the first push to a new repo where the "before" SHA has no parent.
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # If this is a PR, scan only the PR diff
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR detected — scanning full repo"
            gitleaks detect --source . --redact -v --exit-code 2
            exit $?
          fi

          # Try commit-range scan (push event)
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE}^" 2>/dev/null; then
            echo "Scanning commit range: ${BEFORE}..${AFTER}"
            gitleaks detect --source . --redact -v --exit-code 2 \
              --log-opts="${BEFORE}..${AFTER}"
          else
            echo "First push or root commit detected — falling back to full repo scan"
            gitleaks detect --source . --redact -v --exit-code 2
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
